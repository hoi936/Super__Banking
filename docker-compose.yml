services:
  locallink-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: locallink-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-YourStrongPassword123!}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - locallink_sql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-YourStrongPassword123!}" -C -Q "SELECT 1" ||
        /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-YourStrongPassword123!}" -Q "SELECT 1" ||
        exit 1
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - locallink-network

  locallink-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: locallink-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=locallink-sqlserver,1433;Database=${DB_NAME:-LocalLinkDb};User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://127.0.0.1:3000"
      APPLY_MIGRATIONS_AT_STARTUP: "true"
      Jwt__Issuer: "${JWT_ISSUER:-LocalLink}"
      Jwt__Audience: "${JWT_AUDIENCE:-LocalLink.Client}"
      Jwt__Secret: "${JWT_SECRET:-LocalLink_Dev_Super_Secret_Key_Minimum_32_Bytes_Long_2026_Secure_Token_Key!}"
      Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
      Jwt__RefreshTokenDays: "${JWT_REFRESH_TOKEN_DAYS:-7}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      locallink-sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - locallink-network

  locallink-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: locallink-web
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "3000"
      NUXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - locallink-api
    networks:
      - locallink-network

networks:
  locallink-network:
    name: locallink-network
    driver: bridge

volumes:
  locallink_sql_data:
    name: locallink_sql_data
